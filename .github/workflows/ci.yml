name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    # Integration tests (npm test) use ml_test and Redis db 1 from .env.example; same images as docker-compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ml
          POSTGRES_PASSWORD: ml
          POSTGRES_DB: ml_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ml -d ml_test" --health-interval 5s --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
      meilisearch:
        image: getmeili/meilisearch:v1.54.0
        env:
          MEILI_ENV: development
          MEILI_MASTER_KEY: dev-master-key-change-me-0123456789
        ports: ['7700:7700']
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:7700/health" --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Dev-only, non-secret values; @ml/config fails the build if env is missing.
      - run: cp .env.example .env
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Generated client must match the API; no DB/Redis needed (Nest preview mode).
      - name: Check API client is up to date
        run: npm run api:generate && git diff --exit-code -- packages/api-client
